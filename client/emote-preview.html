<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Card emote design preview</title>
    <style>
      :root { font: 16px/1.5 system-ui, sans-serif; color-scheme: dark; color: #eaf2ff; background: #101c30; }
      body { margin: 0 auto; max-width: 880px; padding: 32px 20px; }
      h1 { margin: 4px 0; font-size: clamp(1.6rem, 5vw, 2.5rem); letter-spacing: -.04em; }
      p { color: #a6bad5; margin: 6px 0 24px; }
      .preview-kicker { color: #83efda; text-transform: uppercase; font-size: .7rem; font-weight: 800; letter-spacing: .15em; }
      .preview-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
      button { background: #233853; color: #f1f7ff; border: 1px solid #46617f; border-radius: 8px; padding: 9px 14px; cursor: pointer; font: inherit; font-size: .8rem; }
      button:focus-visible { outline: 3px solid #83efda; outline-offset: 3px; }
      .preview-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .preview-tile { background: #1a2b43; border: 1px solid #2d435f; border-radius: 16px; text-align: center; padding: 20px 8px 16px; }
      .preview-tile .card-emote { width: min(100%, 174px); margin: auto; }
      .preview-tile h2 { margin: 12px 0 0; font-size: .85rem; }
      .preview-scale { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin-top: 22px; padding: 24px 8px; border-radius: 16px; background: #edf3fa; }
      .preview-scale .card-emote { width: 88px; }
      .preview-scale-label { font-size: .8rem; margin-top: 24px; margin-bottom: 8px; color: #a6bad5; }
      @media (max-width: 560px) { .preview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/emote-preview.tsx"></script>
  </body>
</html>
